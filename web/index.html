<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>机器人 BLE 配网</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb;line-height:1.5}
    main{max-width:560px;margin:0 auto;padding:24px 16px}.hero{color:#fff;padding:24px;border-radius:20px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);box-shadow:0 10px 26px #1d4ed833}.hero h1{margin:0 0 5px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-top:15px;box-shadow:0 4px 14px #0f172a0a}.label{display:block;color:#64748b;font-size:13px;margin:14px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe3ef;border-radius:10px;font:inherit;background:#fff}button{border:0;background:#2563eb;color:#fff;font-weight:650;margin-top:15px}button.secondary{background:#eaf2ff;color:#1d4ed8}.status{padding:10px;border-radius:10px;background:#f1f5f9;color:#475569}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}.hint{font-size:13px;color:#64748b}.password{display:flex;gap:8px}.password input{flex:1}.password button{width:auto;margin:0;background:#eef2ff;color:#3730a3}.network{padding:8px 0;border-bottom:1px solid #edf1f7;cursor:pointer}.network:last-child{border:0}
  </style>
</head>
<body><main>
  <section class="hero"><h1>机器人 BLE 配网</h1><p>无需机器人热点，直接通过蓝牙配置 Wi‑Fi</p></section>
  <section class="card"><div id="status" class="status">尚未连接机器人</div><button id="connect" onclick="connectBle()">连接机器人蓝牙</button></section>
  <section id="panel" class="card" hidden>
    <label class="label">附近 Wi‑Fi（由机器人扫描）</label><select id="wifi"><option>请先点击扫描</option></select>
    <button class="secondary" onclick="scanWifi()">扫描 Wi‑Fi</button>
    <label class="label">SSID（隐藏网络可手动填写）</label><input id="ssid" maxlength="32" placeholder="输入 Wi‑Fi 名称">
    <label class="label">密码</label><div class="password"><input id="password" type="password" maxlength="128" placeholder="开放网络可留空"><button type="button" onclick="togglePassword()">显示</button></div>
    <label class="hint"><input id="remember" type="checkbox" checked style="width:auto"> 在此浏览器记住此机器人和 Wi‑Fi 密码</label>
    <button onclick="provision()">连接此 Wi‑Fi</button><div id="message"></div>
  </section>
  <p class="hint">如果浏览器提示不支持 Web Bluetooth，请更换支持 Web Bluetooth 的浏览器或使用在线网页入口。</p>
</main>
<script>
const UUID={service:'12345678-1234-5678-1234-56789abcdef0',ssid:'12345678-1234-5678-1234-56789abcdef1',password:'12345678-1234-5678-1234-56789abcdef2',status:'12345678-1234-5678-1234-56789abcdef3',command:'12345678-1234-5678-1234-56789abcdef4',list:'12345678-1234-5678-1234-56789abcdef5'};
let device,chars={},robotId='';
function msg(t,ok=false){let e=document.getElementById('message');e.textContent=t;e.className=ok?'ok':'err'}
function setStatus(t,ok=false){let e=document.getElementById('status');e.textContent=t;e.className='status '+(ok?'ok':'')}
function text(data){return new TextDecoder().decode(data)}
async function connectBle(){if(!navigator.bluetooth){setStatus('此浏览器不支持 Web Bluetooth');return}try{device=await navigator.bluetooth.requestDevice({filters:[{services:[UUID.service]}],optionalServices:[UUID.service]});device.addEventListener('gattserverdisconnected',()=>setStatus('蓝牙已断开'));let s=await device.gatt.connect(),svc=await s.getPrimaryService(UUID.service);for(let k of ['ssid','password','status','command','list'])chars[k]=await svc.getCharacteristic(UUID[k]);robotId=device.name||device.id;document.getElementById('panel').hidden=false;setStatus('已连接：'+(device.name||'机器人'),true);await scanWifi()}catch(e){setStatus('蓝牙连接失败：'+e.message)}}
async function write(k,v){await chars[k].writeValue(new TextEncoder().encode(v))}
async function scanWifi(){try{setStatus('正在扫描 Wi‑Fi…');await write('command','SCAN');await new Promise(r=>setTimeout(r,3500));let raw=text(await chars.list.readValue());let list=JSON.parse(raw);let s=document.getElementById('wifi');s.innerHTML='';list.forEach(n=>{let o=document.createElement('option');o.value=n.ssid;o.textContent=n.ssid+'　信号 '+n.signal+'%　'+(n.security||'开放');s.appendChild(o)});if(!list.length)s.innerHTML='<option>未发现网络，请手动填写 SSID</option>';s.onchange=()=>{document.getElementById('ssid').value=s.value;loadSaved(s.value)};setStatus('已连接：'+(device.name||'机器人'),true)}catch(e){setStatus('Wi‑Fi 扫描失败：'+e.message)}}
function loadSaved(ssid){let v=localStorage.getItem('robotwifi:'+robotId+':'+ssid);if(v&&!document.getElementById('password').value)document.getElementById('password').value=v}
function togglePassword(){let e=document.getElementById('password'),b=document.querySelector('.password button');e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'显示':'隐藏'}
async function provision(){let s=document.getElementById('ssid').value||document.getElementById('wifi').value,p=document.getElementById('password').value;if(!s){msg('请先选择或填写 SSID');return}try{if(document.getElementById('remember').checked)localStorage.setItem('robotwifi:'+robotId+':'+s,p);await write('ssid',s);await write('password',p);await write('command','CONNECT');setStatus('机器人正在连接 Wi‑Fi…');msg('配置已发送，请等待机器人联网。',true);let n=0;while(n++<20){await new Promise(r=>setTimeout(r,2000));let st=JSON.parse(text(await chars.status.readValue()));if(st.code===2){setStatus('Wi‑Fi 连接成功',true);msg('机器人已连接 '+(st.current_ssid||s),true);break}if(st.code===3){msg('连接失败：'+st.message);break}}}catch(e){msg('发送配置失败：'+e.message)}}
</script></body></html>
